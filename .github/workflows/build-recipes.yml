name: Build recipe data

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-recipes.yml
      - tools/build-recipes.mjs
      - static/vendor-items.json
      - static/vendor-extended-costs.json
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:
    inputs:
      game:
        description: Which game to build (classic or forever)
        required: false
        default: classic
      products:
        description: wago.tools products to look in, comma separated (blank uses the game's default)
        required: false
        default: ''
      version_prefix:
        description: Build version prefix, such as 5. or 1.15 (blank uses the game's default)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: collect-auction-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore previous data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --depth=1 --branch data "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data-out || mkdir -p data-out
          mkdir -p data-out/static

      - name: Pick game settings
        id: cfg
        run: |
          GAME="${{ github.event.inputs.game || 'classic' }}"
          if [ "$GAME" = "forever" ]; then
            echo "products=${{ github.event.inputs.products || 'wow_classic_forever,wow_forever,wow_classic_plus,wow_classic_forever_beta,wow_classic_forever_ptr' }}" >> "$GITHUB_OUTPUT"
            echo "prefix=${{ github.event.inputs.version_prefix }}" >> "$GITHUB_OUTPUT"
            echo "files=data-out/static/forever-recipes.json data-out/static/forever-recipes-build-log.json static/forever-vendor-items.json data-out/static/forever-items.json static/forever-vendor-extended-costs.json data-out/static/forever-currency-items.json" >> "$GITHUB_OUTPUT"
          else
            echo "products=${{ github.event.inputs.products || 'wow_classic,wow_classic_ptr,wow_classic_beta' }}" >> "$GITHUB_OUTPUT"
            echo "prefix=${{ github.event.inputs.version_prefix || '5.' }}" >> "$GITHUB_OUTPUT"
            echo "files=data-out/static/mop-classic-recipes.json data-out/static/recipes-build-log.json static/vendor-items.json data-out/static/mop-classic-items.json static/vendor-extended-costs.json data-out/static/currency-items.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Build recipes from wago.tools
        env:
          WAGO_PRODUCTS: ${{ steps.cfg.outputs.products }}
          WAGO_VERSION_PREFIX: ${{ steps.cfg.outputs.prefix }}
        run: node tools/build-recipes.mjs ${{ steps.cfg.outputs.files }}

      - name: Publish data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd data-out
          rm -rf .git
          git init --quiet -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Recipe data $(date -u +%Y-%m-%dT%H:%MZ)"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force origin data
