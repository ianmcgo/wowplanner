name: Build recipe data

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-recipes.yml
      - tools/build-recipes.mjs
      - static/vendor-items.json
      - static/vendor-extended-costs.json
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-auction-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore previous data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --depth=1 --branch data "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data-out || mkdir -p data-out
          mkdir -p data-out/static

      - name: Build recipes from wago.tools
        run: node tools/build-recipes.mjs data-out/static/mop-classic-recipes.json data-out/static/recipes-build-log.json static/vendor-items.json data-out/static/mop-classic-items.json static/vendor-extended-costs.json data-out/static/currency-items.json

      - name: Publish data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd data-out
          rm -rf .git
          git init --quiet -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Recipe data $(date -u +%Y-%m-%dT%H:%MZ)"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force origin data
